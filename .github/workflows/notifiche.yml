name: Notifiche

on:
  # Gli invii programmati ora partono da Supabase (pg_cron ogni 15 minuti), più puntuale di GitHub.
  # Questo workflow resta solo per le prove manuali.
  workflow_dispatch:
    inputs:
      tipo:
        description: "Prova: quale notifica inviare subito"
        type: choice
        options: [verifiche, compiti]
        default: verifiche

jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=optional --no-audit --no-fund web-push@3.6.7
      - name: Invia notifiche
        env:
          IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
          TIPO: ${{ inputs.tipo }}
        run: node scraper/notifiche.mjs
